# Render Blueprint for the Rayan CMMS web application.
# Secrets are entered in the Render dashboard; no credentials are committed.
services:
  - type: web
    name: rayan-cmms-etihad
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rayan-cmms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: BOOTSTRAP_USERNAME
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: BOOTSTRAP_FULL_NAME
        value: System Programmer
      - key: BOOTSTRAP_RESET_PASSWORD
        value: "false"

databases:
  - name: rayan-cmms-db
    plan: free
    databaseName: maintenance
    user: maintenance
